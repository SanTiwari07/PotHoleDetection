name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The unit tests only need the tracker/fusion deps, not the full YOLO stack.
      - run: pip install numpy scipy filterpy pytest
      - run: python -m py_compile python/main.py update_wifi.py demo/app.py
      - run: pytest -q tests
